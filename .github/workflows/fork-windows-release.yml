# Fork-only workflow: builds the Windows x64 installer from this branch and
# publishes it as a release, mirroring the windows-2022-x64 target of the
# upstream continuous integration workflow.

name: Fork Windows Release

on:
  push:
    branches: [windows-altgr]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      # Fancy checkout gets all the tags
      # it also makes sure we can use git --describe correctly
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.12
          vcpkg-triplet: x64-windows-release

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Configure
        run: ${{env.CMAKE_CONFIGURE}} -G Ninja ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{env.DESKFLOW_VERSION}}-altgr"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8 --target package

      - name: Test package
        uses: ./.github/actions/test-package

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="altgr-${{env.DESKFLOW_VERSION}}"
          cd build
          sha256sum deskflow-*.msi > sums.txt
          {
            echo "Upstream master with [#10214](https://github.com/deskflow/deskflow/pull/10214) (fix(windows): restore right alt as alt and also map it as altgr) merged, built from ${{ github.sha }}."
            echo
            echo "Version ${{env.DESKFLOW_VERSION}} shares the official upgrade code, so the next official release installs over it."
          } > notes.md
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" deskflow-*.msi sums.txt --target "${{ github.sha }}" --title "Deskflow ${{env.DESKFLOW_VERSION}} + AltGr fix" --notes-file notes.md --latest
